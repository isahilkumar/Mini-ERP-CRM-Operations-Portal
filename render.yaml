services:
  # 1. Backend Web Service (Node.js/Express)
  - type: web
    name: mini-erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # 2. Frontend Static Site (React/Vite)
  - type: web
    name: mini-erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mini-erp-backend
          property: host

databases:
  # 3. PostgreSQL Database
  - name: mini-erp-db
    databaseName: mini_erp
    user: erp_user
    plan: free
