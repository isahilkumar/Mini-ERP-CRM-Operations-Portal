services:
  # Single Web Service: Express backend serves built React frontend
  - type: web
    name: mini-erp-portal
    runtime: node
    plan: free
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

databases:
  # Managed PostgreSQL Database
  - name: mini-erp-db
    databaseName: mini_erp
    user: erp_user
    plan: free
